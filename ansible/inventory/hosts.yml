---
all:
  hosts:
    nas:
      ansible_host: penguin-nas
      ansible_user: macmini-ssh
      ansible_port: 1122
      ansible_python_interpreter: /usr/local/bin/python3.9
      # Synology's SFTP subsystem is unreliable, so force the dd-over-ssh pipe.
      ansible_ssh_transfer_method: piped
      # ansible_become_password: "your-sudo-password"  # uncomment if sudo needs a password
